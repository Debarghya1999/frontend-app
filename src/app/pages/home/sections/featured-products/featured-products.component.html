<section class="featured-products" [attr.aria-label]="'Featured products section'">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow">The Bengal Handloom Edit</span>
      <h2 class="section-title">Authentic Cotton Collection</h2>
      <p class="section-subtitle">
        Handwoven cottons, jamdani motifs &amp; master-crafted ethnic wear — celebrating the timeless artistry of Bengal
      </p>
    </div>

    <!-- ── Carousel Shell ── -->
    <div class="carousel-shell">
      <!-- Prev Arrow -->
      <button
        class="carousel-arrow prev"
        aria-label="Scroll products left"
        (click)="scrollBy(-1)">
        <i class="pi pi-angle-left"></i>
      </button>

      <!-- Scrollable Track -->
      <div
        #carousel
        class="carousel-track"
        role="list"
        aria-label="Featured products"
        (scroll)="updateProgress()">

        <app-product-card
          *ngFor="let product of products(); let i = index"
          [product]="product"
          [isWishlisted]="wishlistIds().has(product.productId)"
          (wishlistToggle)="toggleWishlist($event)">
        </app-product-card>

      </div>

      <!-- Next Arrow -->
      <button
        class="carousel-arrow next"
        aria-label="Scroll products right"
        (click)="scrollBy(1)">
        <i class="pi pi-angle-right"></i>
      </button>
    </div>

    <!-- ── Progress Bar ── -->
    <div class="carousel-progress" aria-hidden="true">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- ── Scroll Hint ── -->
    <p class="scroll-hint" aria-hidden="true">
      <i class="pi pi-arrows-h"></i> Drag or use arrows to explore
    </p>

    <div
      class="section-footer"
      [srAnimation]="'fade-up'"
      [srDelay]="100"
      [srDuration]="600">
      <button
        class="btn-view-all"
        routerLink="/collections"
        aria-label="View all products in the collection">
        <span>View All Products</span>
        <i class="pi pi-arrow-right"></i>
      </button>
    </div>
  </div>
</section>
