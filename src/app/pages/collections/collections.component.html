<!-- ═══════════════════════════════════════════════════════
     Shop Page — Heritage Modernist | The Artisan Boutique
     ═══════════════════════════════════════════════════════ -->
<div class="collections-page">

  <!-- ── Ambient Background ── -->
  <div class="collections-bg-motif" aria-hidden="true">
    <svg class="bg-motif-svg" viewBox="0 0 600 600" fill="none">
      <circle cx="300" cy="300" r="280" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="300" cy="300" r="200" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="300" cy="300" r="120" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.03" />
    </svg>
  </div>

  <!-- ── Floating orb decoration ── -->
  <div class="collections-orb collections-orb--1" aria-hidden="true"></div>
  <div class="collections-orb collections-orb--2" aria-hidden="true"></div>

  <!-- ── Page Header ── -->
  <div class="collections-header-area">
    <nav class="collections-breadcrumb" aria-label="Breadcrumb">
      <a routerLink="/home" class="bc-link">Home</a>
      <span class="bc-sep" aria-hidden="true">/</span>
      <span class="bc-current">Collections</span>
    </nav>

    <div class="collections-headline-block">
      <div class="headline-left">
        <h1 class="collections-headline">
          Masterpiece <em>Collections</em>
        </h1>
        <div class="headline-rule" aria-hidden="true"></div>
      </div>
      <div class="collections-meta">
        <span class="collections-count-badge">
          <span class="count-number">{{ filteredProducts.length }}</span>
          <span class="count-label">hand-crafted pieces</span>
        </span>
        <button *ngIf="hasActiveFilters" class="clear-all-btn" (click)="resetFilters()" type="button"
          aria-label="Clear all filters">
          <i class="pi pi-times-circle"></i>
          Clear all
          <span class="active-filter-count">{{ activeFilterCount }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Mobile Filter Toggle ── -->
  <button class="filter-toggle-btn" (click)="mobileFilterOpen.set(!mobileFilterOpen())" type="button"
    [attr.aria-expanded]="mobileFilterOpen()" aria-controls="filter-sidebar">
    <i class="pi pi-sliders-h"></i>
    <span>{{ mobileFilterOpen() ? 'Hide Filters' : 'Show Filters' }}</span>
    <span *ngIf="activeFilterCount > 0" class="toggle-filter-badge">{{ activeFilterCount }}</span>
  </button>

  <!-- ── Main Layout ── -->
  <div class="collections-layout">

    <!-- ══════════════════════════════════════
         FILTER SIDEBAR (Dynamic Component)
         ══════════════════════════════════════ -->
    <app-filter-sidebar 
      [products]="allProducts"
      [activeFilters]="activeFilters"
      [isMobileOpen]="mobileFilterOpen()"
      (filtersChanged)="onFilterChange($event)"
      (reset)="resetFilters()"
      (closeMobile)="mobileFilterOpen.set(false)">
    </app-filter-sidebar>

    <!-- ══════════════════════════════════════
         PRODUCT AREA
         ══════════════════════════════════════ -->
    <div class="product-area">

      <!-- Sort Toolbar -->
      <div class="collections-toolbar" *ngIf="!productsLoading()">
        <p class="toolbar-count">
          Showing <strong>{{ filteredProducts.length }}</strong> pieces
        </p>
        <div class="toolbar-sort">
          <label for="sort-select" class="sort-label">Sort By:</label>
          <select id="sort-select" class="sort-select" [(ngModel)]="sortBy" (ngModelChange)="onSortChange()">
            <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>

      <!-- Loading State -->
      <div class="products-loading-state" *ngIf="productsLoading()">
        <div class="loading-spinner"></div>
        <p>Curating boutique collection...</p>
      </div>

      <!-- Product Grid -->
      <div class="product-grid" *ngIf="!productsLoading() && paginatedProducts.length > 0; else emptyState">
        <app-product-card
          *ngFor="let product of paginatedProducts; trackBy: trackByProductId"
          [product]="product"
          [isWishlisted]="wishlistIds.has(product.productId)"
          (wishlistToggle)="toggleWishlist($event)">
        </app-product-card>

      </div>

      <!-- Empty State -->
      <ng-template #emptyState>
        <div class="empty-state" role="status" aria-live="polite" *ngIf="!productsLoading()">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="1.5" />
              <path d="M22 32a10 10 0 1120 0 10 10 0 01-20 0z" stroke="currentColor" stroke-width="1.5" />
              <path d="M27 32h10M32 27v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </div>
          <h3 class="empty-title">No pieces found</h3>
          <p class="empty-subtitle">Refine your filters to discover our curated collection.</p>
          <button class="empty-reset-btn" (click)="resetFilters()" type="button">
            <i class="pi pi-refresh"></i> Reset Filters
          </button>
        </div>
      </ng-template>

      <!-- Pagination -->
      <nav class="collections-pagination" *ngIf="!productsLoading() && totalPages > 1" aria-label="Product pages">
        <button class="page-btn page-btn--prev" [disabled]="currentPage === 0" (click)="onPageChange(currentPage - 1)"
          type="button" aria-label="Previous page">
          <i class="pi pi-arrow-left"></i>
          <span>Previous</span>
        </button>

        <div class="page-numbers">
          <button *ngFor="let page of pageNumbers" class="page-num" [class.page-num--active]="page === currentPage"
            (click)="onPageChange(page)" type="button" [attr.aria-current]="page === currentPage ? 'page' : null">
            {{ (page + 1).toString().padStart(2, '0') }}
          </button>
        </div>

        <button class="page-btn page-btn--next" [disabled]="currentPage === totalPages - 1"
          (click)="onPageChange(currentPage + 1)" type="button" aria-label="Next page">
          <span>Next</span>
          <i class="pi pi-arrow-right"></i>
        </button>
      </nav>

    </div><!-- /product-area -->
  </div><!-- /collections-layout -->

</div><!-- /collections-page -->
