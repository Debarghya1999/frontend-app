<section class="hero-section" [attr.aria-label]="'Hero section'">
  <div class="hero-background">
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
  </div>

  <div class="hero-content">
    <div class="hero-text-container">

      <span
        class="hero-eyebrow"
        [srAnimation]="'fade-up'"
        [srDelay]="200"
        [srDuration]="1200"
        aria-label="New Season">2025 Handcrafted Cotton Lookbook</span>

      <h1
        class="hero-title"
        [srAnimation]="'tilt-in'"
        [srDelay]="0"
        [srDuration]="1600">
        Discover <em class="highlight">Authentic</em><br>
        Bengali Cotton Wear
      </h1>

      <p
        class="hero-subtitle"
        [srAnimation]="'fade-up'"
        [srDelay]="300"
        [srDuration]="1400">
        Curated collections of handwoven cotton sarees, elegant kurtis, and classic panjabis
        — celebrating authentic Bengal craftsmanship with everyday elegance.
      </p>

      <div
        class="hero-cta-buttons"
        [srAnimation]="'zoom-drift'"
        [srDelay]="500"
        [srDuration]="1400">
        <button
          class="btn btn-primary"
          routerLink="/shop"
          [queryParams]="{ featured: true }"
          aria-label="Browse ethnic collection">
          <span class="btn-icon">
            <i class="pi pi-shopping-bag"></i>
          </span>
          Browse Collection
        </button>

        <button
          class="btn btn-secondary"
          (click)="scrollToSection('testimonials')"
          aria-label="Scroll to customer stories">
          <span class="btn-icon">
            <i class="pi pi-star"></i>
          </span>
          Customer Stories
        </button>
      </div>

      <div
        class="hero-stats"
        [srAnimation]="'fade-up'"
        [srDelay]="700"
        [srDuration]="1400">
        <div class="stat-item" *ngFor="let stat of stats()">
          <span class="stat-number">{{ stat.number }}</span>
          <span class="stat-label">{{ stat.label }}</span>
        </div>
      </div>
    </div>

    <div
      class="hero-image-container"
      [srAnimation]="'slide-right'"
      [srDelay]="150"
      [srDuration]="2000"
      [srThreshold]="0.05">
      <div class="hero-image">
        <img
          src="images/hero_image.png"
          alt="Authentic Bengali cotton wear — handwoven sarees and panjabis"
          loading="lazy"
          decoding="async"
          (error)="onHeroImageError($event)">
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator" aria-hidden="true">
    <span class="scroll-icon">
      <i class="pi pi-chevron-down"></i>
    </span>
  </div>

</section>
