<section class="testimonials" id="testimonials" [attr.aria-label]="'Customer testimonials'">
  <div class="container">
    <div
      class="section-header"
      [srAnimation]="'tilt-in'"
      [srDelay]="0"
      [srDuration]="1600">
      <span class="section-eyebrow">Client Stories</span>
      <h2 class="section-title">Loved Across India</h2>
      <p class="section-subtitle">
        Real voices from our community — handloom lovers, everyday wearers &amp; style connoisseurs who love Bengali cottons
      </p>
    </div>

    <div class="testimonials-grid">
      <div
        *ngFor="let testimonial of testimonials(); let i = index"
        class="testimonial-card"
        [srAnimation]="'zoom-drift'"
        [srDelay]="i * 300"
        [srDuration]="1600"
        [srThreshold]="0.08"
        [style.--delay]="(i * 0.12) + 's'"
        role="article"
        [attr.aria-label]="'Testimonial from ' + testimonial.name">

        <div class="testimonial-rating">
          <i
            *ngFor="let star of [1,2,3,4,5]"
            class="pi pi-star-fill"
            [class.outlined]="star > testimonial.rating"
            [attr.aria-hidden]="true">
          </i>
        </div>

        <p class="testimonial-text">
          "{{ testimonial.text }}"
        </p>

        <div class="testimonial-author">
          <img
            [src]="testimonial.image"
            [alt]="testimonial.name + ' — verified customer'"
            class="author-image"
            loading="lazy"
            decoding="async"
            (error)="onAvatarError($event)">

          <div class="author-info">
            <h4 class="author-name">{{ testimonial.name }}</h4>
            <p class="author-role">{{ testimonial.role }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Carousel Navigation -->
    <div class="carousel-nav" role="tablist" [attr.aria-label]="'Testimonial navigation'">
      <button
        class="nav-dot"
        *ngFor="let item of testimonials(); let i = index"
        [class.active]="i === currentIndex()"
        (click)="goToTestimonial(i)"
        role="tab"
        [attr.aria-label]="'Go to testimonial ' + (i + 1)"
        [attr.aria-selected]="i === currentIndex()">
      </button>
    </div>
  </div>
</section>
